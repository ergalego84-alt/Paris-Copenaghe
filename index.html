<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>París & Copenhague</title>

    <meta name="theme-color" content="#071a2f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="París & Copenhague">

    <link rel="manifest" href="manifest.json">

    <style>

        :root {
            --navy: #071a2f;
            --navy2: #0d2945;
            --blue: #1769aa;
            --gold: #d9a441;
            --cream: #f7f3eb;
            --white: #ffffff;
            --text: #263238;
            --muted: #718096;
            --green: #2e9d63;
            --red: #d9534f;
            --shadow: 0 8px 25px rgba(0,0,0,.10);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            padding-bottom: 82px;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================= */

        .hero {
            min-height: 280px;
            position: relative;
            overflow: hidden;
            color: white;
            display: flex;
            align-items: flex-end;
            padding: 28px 20px;
            background:
                linear-gradient(
                    rgba(0,25,50,.45),
                    rgba(0,20,40,.85)
                ),
                url("https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1400&q=85")
                center/cover;
        }

        .hero-content {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1;
        }

        .hero p {
            margin: 12px 0 0;
            font-size: 1.05rem;
            opacity: .92;
        }

        .hero-date {
            display: inline-block;
            margin-top: 15px;
            padding: 7px 12px;
            border-radius: 50px;
            background: rgba(255,255,255,.16);
            backdrop-filter: blur(8px);
        }

        /* =========================
           CONTENEDOR
        ========================= */

        main {
            width: min(100%, 1000px);
            margin: auto;
            padding: 18px;
        }

        .page {
            display: none;
            animation: fade .2s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           HOME
        ========================= */

        .welcome {
            text-align: center;
            padding: 10px 5px 25px;
        }

        .welcome h2 {
            margin-bottom: 5px;
            color: var(--navy);
        }

        .welcome p {
            color: var(--muted);
            margin-top: 5px;
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .home-card {
            min-height: 145px;
            border: 0;
            border-radius: var(--radius);
            color: white;
            padding: 18px;
            text-align: left;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .home-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                transparent 20%,
                rgba(0,0,0,.78)
            );
        }

        .home-card > * {
            position: relative;
            z-index: 2;
        }

        .home-card .icon {
            position: absolute;
            top: 15px;
            left: 17px;
            font-size: 2rem;
        }

        .home-card h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .home-card p {
            margin: 5px 0 0;
            font-size: .8rem;
            opacity: .9;
        }

        .paris-card {
            background-image: url("https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=800&q=80");
        }

        .cph-card {
            background-image: url("https://images.unsplash.com/photo-1513622470522-26c3c8a854bc?auto=format&fit=crop&w=800&q=80");
        }

        .map-card {
            background-image: url("https://images.unsplash.com/photo-1524666041070-9a87674904b7?auto=format&fit=crop&w=800&q=80");
        }

        .food-card {
            background-image: url("https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=800&q=80");
        }

        .flight-card {
            background-image: url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=800&q=80");
        }

        .check-card {
            background-image: url("https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80");
        }

        .expense-card {
            background-image: url("https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=800&q=80");
        }

        .docs-card {
            background-image: url("https://images.unsplash.com/photo-1563013544-824ae1b704d3?auto=format&fit=crop&w=800&q=80");
        }

        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            border: 0;
            background: var(--navy);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .page-header h2 {
            margin: 0;
            color: var(--navy);
        }

        /* =========================
           CARDS
        ========================= */

        .card {
            background: white;
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
        }

        .card h3 {
            margin-top: 0;
            color: var(--navy);
        }

        .location {
            display: inline-block;
            margin: 4px 0;
            color: var(--blue);
            font-size: .86rem;
            text-decoration: none;
            font-weight: 600;
        }

        .duration {
            display: inline-block;
            background: #eef4f8;
            color: var(--blue);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: .78rem;
            font-weight: bold;
        }

        .day-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .day-title h3 {
            margin: 0;
        }

        .timeline-item {
            position: relative;
            padding: 0 0 20px 25px;
            border-left: 2px solid #dce5eb;
            margin-left: 8px;
        }

        .timeline-item:last-child {
            border-left-color: transparent;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -7px;
            top: 2px;
            width: 11px;
            height: 11px;
            background: var(--gold);
            border-radius: 50%;
        }

        .time {
            font-weight: 800;
            color: var(--navy);
            font-size: .9rem;
        }

        .route {
            display: block;
            text-align: center;
            background: var(--blue);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
            font-weight: bold;
        }

        /* =========================
           WEATHER
        ========================= */

        .weather-box {
            background: linear-gradient(135deg, #0c3558, #1769aa);
            color: white;
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }

        .weather-icon {
            font-size: 3rem;
        }

        .temperature {
            font-size: 2rem;
            font-weight: 800;
        }

        .hourly {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 5px;
        }

        .hour {
            min-width: 70px;
            text-align: center;
            background: rgba(255,255,255,.13);
            border-radius: 12px;
            padding: 8px 5px;
        }

        .hour strong {
            display: block;
        }

        .hour small {
            display: block;
            margin-top: 4px;
        }

        .weather-note {
            font-size: .8rem;
            opacity: .85;
            margin-top: 10px;
        }

        /* =========================
           CHECKLIST
        ========================= */

        .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .check-row:last-child {
            border-bottom: 0;
        }

        .check-row input {
            width: 21px;
            height: 21px;
            accent-color: var(--green);
        }

        .check-info {
            flex: 1;
        }

        .check-info strong {
            display: block;
        }

        .check-info small {
            color: var(--muted);
        }

        .recommendation {
            border: 2px solid #f0dfb4;
            background: #fffaf0;
        }

        .recommendation-badge {
            display: inline-block;
            font-size: .7rem;
            background: var(--gold);
            color: white;
            padding: 4px 7px;
            border-radius: 10px;
            margin-bottom: 7px;
        }

        .add-btn {
            border: 0;
            background: var(--green);
            color: white;
            padding: 9px 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* =========================
           MAP
        ========================= */

        .map-container {
            border-radius: var(--radius);
            overflow: hidden;
            background: #ddd;
            min-height: 450px;
        }

        .map-placeholder {
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            background:
                linear-gradient(
                    rgba(255,255,255,.7),
                    rgba(255,255,255,.7)
                ),
                url("https://images.unsplash.com/photo-1524666041070-9a87674904b7?auto=format&fit=crop&w=1400&q=80")
                center/cover;
        }

        .map-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .map-buttons button {
            padding: 12px;
            border: 0;
            border-radius: 12px;
            background: var(--navy);
            color: white;
            font-weight: bold;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }

        .legend span {
            padding: 6px 9px;
            background: white;
            border-radius: 20px;
            font-size: .75rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        /* =========================
           EXPENSES
        ========================= */

        .expense-form {
            display: grid;
            gap: 10px;
        }

        .expense-form input,
        .expense-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
        }

        .people-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 8px;
        }

        .person-check {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 9px;
        }

        .person-check label {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .expense-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .expense-item:last-child {
            border: 0;
        }

        .expense-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .amount {
            font-weight: 800;
            color: var(--green);
        }

        .totals {
            display: grid;
            gap: 8px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f5f7f9;
            border-radius: 10px;
        }

        .settlement {
            background: #eef8f2;
            border-left: 4px solid var(--green);
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* =========================
           FLIGHTS
        ========================= */

        .flight {
            border-left: 5px solid var(--blue);
        }

        .flight-number {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--navy);
        }

        .drive-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background: var(--gold);
            color: white;
            padding: 13px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(7,26,47,.97);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .bottom-nav button {
            background: none;
            border: 0;
            color: white;
            opacity: .75;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: .7rem;
        }

        .bottom-nav button.active {
            opacity: 1;
            color: #ffd36a;
        }

        .bottom-nav .nav-icon {
            font-size: 1.35rem;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .home-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .home-card {
                min-height: 180px;
            }

            .people-grid {
                grid-template-columns: repeat(5,1fr);
            }
        }

    </style>
</head>

<body>

<header class="hero">
    <div class="hero-content">
        <h1>✈️ París & Copenhague</h1>
        <p>Una aventura en grupo 🇫🇷 🇩🇰</p>
        <span class="hero-date">3 — 8 diciembre 2026</span>
    </div>
</header>

<main>

    <!-- =========================
         INICIO
    ========================== -->

    <section id="home" class="page active">

        <div class="welcome">
            <h2>¡Preparados para viajar!</h2>
            <p>Todo el viaje en un solo sitio.</p>
        </div>

        <div class="home-grid">

            <button class="home-card paris-card" onclick="openPage('paris')">
                <span class="icon">🇫🇷</span>
                <h3>París</h3>
                <p>Itinerario · Tiempo · Recomendaciones</p>
            </button>

            <button class="home-card cph-card" onclick="openPage('cph')">
                <span class="icon">🇩🇰</span>
                <h3>Copenhague</h3>
                <p>Itinerario · Tiempo · Recomendaciones</p>
            </button>

            <button class="home-card map-card" onclick="openPage('map')">
                <span class="icon">📍</span>
                <h3>Mapa</h3>
                <p>Todos los lugares del viaje</p>
            </button>

            <button class="home-card check-card" onclick="openPage('checklist')">
                <span class="icon">☑️</span>
                <h3>Checklist</h3>
                <p>Lugares pendientes y añadidos</p>
            </button>

            <button class="home-card food-card" onclick="openPage('food')">
                <span class="icon">🍴</span>
                <h3>Comer</h3>
                <p>Restaurantes · Bares · Comida típica</p>
            </button>

            <button class="home-card flight-card" onclick="openPage('flights')">
                <span class="icon">✈️</span>
                <h3>Vuelos</h3>
                <p>Horarios · Reservas · Estado</p>
            </button>

            <button class="home-card expense-card" onclick="openPage('expenses')">
                <span class="icon">💶</span>
                <h3>Gastos</h3>
                <p>Quién paga · Reparto · Liquidación</p>
            </button>

            <button class="home-card docs-card" onclick="openPage('documents')">
                <span class="icon">📁</span>
                <h3>Documentos</h3>
                <p>DNIs y documentación en Drive</p>
            </button>

        </div>

    </section>


    <!-- =========================
         PARÍS
    ========================== -->

    <section id="paris" class="page">

        <div class="page-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <h2>🇫🇷 París</h2>
        </div>

        <div class="weather-box">

            <div class="weather-header">
                <strong>🌦️ Tiempo en París</strong>
                <span>Actualización automática</span>
            </div>

            <div class="weather-main">
                <div class="
